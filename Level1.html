<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Level 2</title>
<style>
 body{background:#FFFBEB;font-family:Consolas,monospace;display:flex;flex-direction:column;align-items:center;padding:20px;margin:0}
 h2{font-family:sans-serif;color:#111}
 #board{width:360px;background:white;border:1px solid #E7E5E4;padding:12px;border-radius:10px;display:flex;flex-direction:column;gap:6px}
.tile{background:#F5F5F4;border:1px solid #D6D3D1;padding:10px 12px;border-radius:6px;cursor:move;font-size:14px;white-space:pre}
.tile:hover{background:#E7E5E4}
 #btn{margin-top:20px;background:#111;color:white;border:none;padding:12px 25px;border-radius:6px;cursor:pointer}
 #msg{margin-top:15px;font-family:sans-serif;font-weight:bold}
</style>
</head>
<body>
<h2>LEVEL 2 - HARD</h2>
<p style="font-family:sans-serif;color:#78716C;font-size:13px">Susun logic javascript biar benar</p>
<div id="board"></div>
<button id="btn" onclick="cek()">CEK JAWABAN</button>
<div id="msg"></div>
<script>
const benar=[
"function cekNilai(score){",
" if(score >= 90){",
" return 'A';",
" } else if(score >= 75){",
" return 'B';",
" } else if(score >= 60){",
" return 'C';",
" } else {",
" return 'Gagal';",
" }",
"}",
"console.log(cekNilai(82));"
];
let acak=[...benar].sort(()=>Math.random()-0.5);let drag=null;
function render(){let b=document.getElementById('board');b.innerHTML='';acak.forEach((t,i)=>{let d=document.createElement('div');d.className='tile';d.draggable=true;d.textContent=t;d.ondragstart=()=>drag=i;d.ondragover=e=>e.preventDefault();d.ondrop=()=>{let x=acak[drag];acak[drag]=acak[i];acak[i]=x;render()};b.appendChild(d)})}
function cek(){let m=document.getElementById('msg');if(JSON.stringify(acak)===JSON.stringify(benar)){m.style.color='green';m.textContent='BENAR! GGWP -> Lanjut Level 3';}else{m.style.color='red';m.textContent='SALAH - Logicnya masih berantakan!';}}
render();
</script>
</body>
</html>
