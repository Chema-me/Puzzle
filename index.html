<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINISH THIS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
*{box-sizing:border-box}
body{margin:0;background:#040404;color:#fff;font-family:'JetBrains Mono',monospace;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:12px}
.wrap{width:100%;max-width:380px;border:1px solid rgba(0,255,136,.35);border-radius:28px;padding:24px 22px 26px;background:#080808;box-shadow:0 0 60px rgba(0,255,136,.18)}
h1{margin:0;font-size:42px;font-weight:700;line-height:1;letter-spacing:10px;text-shadow:0 0 10px #00ff88, 0 0 25px rgba(0,255,136,.8)}
.sub{color:#00ff88;opacity:.5;letter-spacing:4px;font-size:10px;margin-top:8px}
.card{margin-top:20px;background:#000;border-radius:18px;padding:18px 16px;border:1px solid #111}
.l1{color:#5a5a5a;font-size:13px}
.l2{margin-top:12px;color:#00d9ff;font-size:14px;letter-spacing:.5px}
.l2 span{color:#fff}
.l3{margin-top:4px;color:#00d9ff;font-size:14px}
.l3 span{color:#5aff8d;letter-spacing:3px}
.l4{margin-top:14px;color:#00ff88;font-size:11px;line-height:1.7}
.inp{width:100%;margin-top:18px;background:#000;border:1.6px solid #00ff88;border-radius:14px;padding:15px;color:#00ff88;text-align:center;letter-spacing:4px;font-size:15px;font-family:inherit;outline:none}
.btn{width:100%;margin-top:11px;background:#00ff88;border:none;border-radius:14px;padding:16px;color:#000;text-align:center;letter-spacing:3px;font-weight:800;font-size:14px;font-family:inherit;box-shadow:0 0 22px rgba(0,255,136,.8);cursor:pointer}
#r{text-align:center;margin-top:10px;font-size:10px;height:12px}
</style>
</head>
<body>
<div class="wrap">
<h1>FINISH<br>THIS</h1>
<div class="sub">PUZZLE LEVEL 01 // CIPHER</div>
<div class="card">
<div class="l1">> decrypt sequence:</div>
<div class="l2"><span style="color:#00d9ff">CODE:</span> <span>8-5-12-12-15 // 23-15-18-12-4</span></div>
<div class="l3">TARGET: <span>_ _ _ _ _ // _ _ _ _ _</span></div>
<div class="l4">CLUE: A=1, B=2, C=3...<br>answer = 2 most famous words in the coding world</div>
</div>
<input id="a" class="inp" placeholder="ENTER ANSWER">
<button class="btn" onclick="go()">DECRYPT</button>
<div id="r"></div>
</div>
<script>
function go(){
let v=document.getElementById('a').value.toLowerCase().replace(/\s/g,'');
let r=document.getElementById('r');
if(v==='helloworld'){r.style.color='#00ff88';r.innerText='> CORRECT - NEXT LEVEL';setTimeout(()=>location.href='level2.html',700)}else{r.style.color='#ff3344';r.innerText='> WRONG CODE'}}
}
</script>
</body>
</html>
