<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Meja Misi - 6 Gambar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🗺️ MEJA MISI</h1>
  <p>Pencet salah satu gambar untuk buka tantangan</p>
  <p>Selesai: <b id="skor">0 / 6</b></p>

  <div class="meja" id="meja"></div>

  <!-- POPUP TANTANGAN -->
  <div id="popup" class="popup hidden">
    <div class="popup-box">
      <button class="close" onclick="tutup()">X</button>
      <img id="popup-img" src="">
      <h2 id="popup-judul"></h2>
      <p id="popup-soal"></p>
      <input id="jawaban" placeholder="Ketik jawaban kamu...">
      <button onclick="cekJawaban()">Jawab</button>
      <p id="hasil"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
