<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FINISH THIS - LEVEL 02</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
body{margin:0;background:#050507;color:#00ff88;font-family:'JetBrains Mono',monospace;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.box{width:100%;max-width:580px;border:1px solid rgba(0,255,136,.3);border-radius:16px;padding:30px;background:rgba(0,255,136,.03);box-shadow:0 0 40px rgba(0,255,136,.15)}
h1{margin:0;color:#fff;font-size:28px;letter-spacing:5px;text-shadow:0 0 12px #00ff88}
.sub{font-size:11px;opacity:.5;margin-top:6px;letter-spacing:2px}
.lock{margin-top:20px;background:#000;border:1px solid #111;border-radius:12px;padding:20px;text-align:center}
input{width:100%;background:#000;border:1px solid #00ff88;color:#00ff88;padding:12px;border-radius:8px;text-align:center;letter-spacing:3px;box-sizing:border-box;font-family:inherit}
button{width:100%;background:#00ff88;color:#000;border:none;padding:12px;border-radius:8px;margin-top:10px;font-weight:700;letter-spacing:2px;cursor:pointer;font-family:inherit}
.grid{display:none;grid-template-columns:1fr;gap:12px;margin-top:20px}
.card{display:block;text-decoration:none;background:#000;border:1px solid rgba(0,255,136,.2);border-radius:10px;padding:14px;color:#00ff88;transition:.2s;cursor:pointer}
.card:hover{border-color:#00ff88;box-shadow:0 0 15px rgba(0,255,136,.3);transform:translateY(-2px)}
.card b{color:#fff;display:block;margin-bottom:4px}
.card span{font-size:11px;opacity:.6;word-break:break-all}
#status{margin-top:10px;font-size:12px}
#videoModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:99;justify-content:center;align-items:center;padding:20px}
#videoModal video{width:100%;max-width:700px;border-radius:12px;border:1px solid #00ff88;box-shadow:0 0 30px rgba(0,255,136,.4)}
#closeBtn{position:absolute;top:20px;right:20px;background:#00ff88;color:#000;border:none;padding:8px 14px;border-radius:8px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<h1>FINISH THIS</h1>
<div class="sub">LEVEL 02 // ACCESS LINKS - RANDOMIZED SYSTEM</div>
<div class="lock" id="lockBox">
<div style="font-size:11px;opacity:.6;margin-bottom:10px">> ENTER LEVEL 01 KEY TO UNLOCK</div>
<input id="key" placeholder="ENTER KEY">
<button onclick="unlock()">UNLOCK LINKS</button>
<div id="status"></div>
</div>
<div class="grid" id="grid"></div>
</div>

<div id="videoModal">
<button id="closeBtn" onclick="closeClip()">X CLOSE</button>
<video id="clipPlayer" controls autoplay playsinline loop></video>
</div>

<script>
const LINKS = [
  { title: "LINK #1 - MAIN", url: "https://link-1.com", type: "link" },
  { title: "LINK #2 - SECRET CLIP", url: "clip.mp4", type: "clip" },
  { title: "LINK #3 - SERVER EU", url: "https://link-3.com", type: "link" },
  { title: "LINK #4 - SERVER US", url: "https://link-4.com", type: "link" },
  { title: "LINK #5 - MIRROR", url: "https://link-5.com", type: "link" }
];

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
shuffle(LINKS);

function unlock(){
  let v=document.getElementById('key').value.toLowerCase().replace(/\s/g,'');
  let s=document.getElementById('status');
  if(v==='helloworld'){
    document.getElementById('lockBox').style.display='none';
    render();
  } else {
    s.innerText='> WRONG KEY';
    s.style.color='#ff3344';
  }
}

function render(){
  let g=document.getElementById('grid');
  g.style.display='grid';
  g.innerHTML='';
  LINKS.forEach(link=>{
    let a=document.createElement('a');
    a.className='card';
    if(link.type==='clip'){
      a.href='javascript:void(0)';
      a.onclick=()=>openClip(link.url);
      a.innerHTML=`<b>${link.title} [CLIP]</b><span>PLAY INSIDE - AUTO PLAY</span>`;
    } else {
      a.href=link.url;
      a.target='_blank';
      a.innerHTML=`<b>${link.title}</b><span>${link.url}</span>`;
    }
    g.appendChild(a);
  });
}

function openClip(src){
  let modal=document.getElementById('videoModal');
  let player=document.getElementById('clipPlayer');
  player.src=src;
  modal.style.display='flex';
  player.play();
}
function closeClip(){
  let modal=document.getElementById('videoModal');
  let player=document.getElementById('clipPlayer');
  modal.style.display='none';
  player.pause();
  player.src='';
}
</script>
</body>
</html>
