<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTEM // LEVEL 02</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
body{margin:0;background:#050507;color:#00ff88;font-family:'JetBrains Mono',monospace;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.box{width:100%;max-width:600px;border:1px solid rgba(0,255,136,.3);border-radius:16px;padding:30px;background:rgba(0,255,136,.03);box-shadow:0 0 40px rgba(0,255,136,.15)}
h1{margin:0;color:#fff;font-size:28px;letter-spacing:5px;text-shadow:0 0 10px #00ff88}
.sub{font-size:11px;opacity:.5;margin-top:5px;letter-spacing:2px}
.locked{margin-top:25px;background:#000;border-radius:12px;padding:22px;border:1px solid #111;text-align:center}
input{width:100%;background:#000;border:1px solid #00ff88;color:#00ff88;padding:14px;border-radius:8px;margin-top:14px;text-align:center;letter-spacing:3px;box-sizing:border-box;font-family:inherit;text-transform:uppercase}
button{width:100%;background:#00ff88;color:#000;border:none;padding:14px;border-radius:8px;margin-top:10px;font-weight:700;letter-spacing:2px;cursor:pointer;font-family:inherit}
.grid{display:none;grid-template-columns:1fr 1fr;gap:14px;margin-top:25px}
.card{background:#000;border:1px solid #222;border-radius:12px;padding:16px;cursor:pointer;transition:.2s;text-decoration:none;color:inherit;display:block}
.card:hover{border-color:#00ff88;box-shadow:0 0 15px rgba(0,255,136,.2);transform:translateY(-2px)}
.card .num{font-size:10px;color:#555}.card .title{color:#fff;font-weight:700;margin-top:4px;letter-spacing:1px}.card .desc{font-size:11px;color:#666;margin-top:6px;line-height:1.4}
.card:nth-child(5){grid-column:span 2}
#err{font-size:11px;margin-top:10px;height:14px}
</style>
</head>
<body>
<div class="box">
<h1>LEVEL 02</h1>
<div class="sub">// ENTER PREVIOUS KEY TO UNLOCK</div>

<div id="gate" class="locked">
<div style="font-size:12px;color:#888">REQUIRED: PASSWORD FROM LEVEL 01</div>
<input id="pass" placeholder="ENTER LEVEL 01 KEY">
<button onclick="unlock()">UNLOCK SYSTEM</button>
<div id="err"></div>
</div>

<div id="content" class="grid"></div>
</div>

<script>
// === EDIT 5 LINK DISINI AJA, GAMPANG KAYAK BILLNEXT ===
const LINKS = [
  { title: "FILE_01 // LOG", desc: "Isi clue pertama disini", url: "https://google.com" },
  { title: "FILE_02 // TRACE", desc: "Isi clue kedua disini", url: "https://google.com" },
  { title: "FILE_03 // CIPHER", desc: "Isi clue ketiga disini", url: "https://google.com" },
  { title: "FILE_04 // KEY", desc: "Isi clue keempat disini", url: "https://google.com" },
  { title: "FILE_05 // FINAL", desc: "Isi clue terakhir disini - final key", url: "https://google.com" },
];
// =====================================================

function unlock(){
  let v = document.getElementById('pass').value.toLowerCase().replace(/\s/g,'');
  let e = document.getElementById('err');
  if(v === 'helloworld'){
    document.getElementById('gate').style.display='none';
    let grid = document.getElementById('content');
    grid.style.display='grid';
    LINKS.forEach((link, i)=>{
      let a = document.createElement('a');
      a.className='card';
      a.href=link.url;
      a.target='_blank';
      a.innerHTML=`<div class="num">0${i+1} // ACCESS</div><div class="title">${link.title}</div><div class="desc">${link.desc}</div>`;
      grid.appendChild(a);
    });
  } else {
    e.innerText='> ACCESS DENIED - WRONG KEY';
    e.style.color='#ff3344';
  }
}
</script>
</body>
  </html>
