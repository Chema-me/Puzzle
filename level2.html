<div id="level02">
<b>LEVEL 02 // TURN THEM OFF</b>
<div style="font-size:11px;opacity:0.6;margin:6px 0">5 SCREENS. 5 FACES. CLICK THEM BEFORE THEY STARE BACK.</div>
<div id="grid02" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"></div>
<div id="win02" style="display:none;text-align:center;padding:60px 0;letter-spacing:4px">You have completed the beginning</div>
</div>

<script>
const grid=document.getElementById('grid02');
const win=document.getElementById('win02');
let left=5;

for(let i=0;i<5;i++){
  let box=document.createElement('div');
  box.style.cssText='background:#000;height:130px;position:relative;overflow:hidden;border:1px solid #222;cursor:crosshair';
  box.innerHTML='<canvas style="width:100%;height:100%"></canvas><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;opacity:0;transition:0.1s" class="face">:)</div>';
  let canvas=box.querySelector('canvas'); let ctx=canvas.getContext('2d');
  canvas.width=200; canvas.height=130;
  let alive=true, faceTimer=0;

  // static noise
  setInterval(()=>{ if(!alive) return;
    let img=ctx.createImageData(200,130);
    for(let j=0;j<img.data.length;j+=4){ let v=Math.random()*255; img.data[j]=v; img.data[j+1]=v; img.data[j+2]=v; img.data[j+3]=255; }
    ctx.putImageData(img,0,0);
  },50);

  // munculin muka random
  setInterval(()=>{ if(!alive) return;
    if(Math.random()<0.15){ 
      let f=box.querySelector('.face'); 
      f.innerText=['ʘ_ʘ','ಠ_ಠ','☻','◉_◉','⚆_⚆'][Math.floor(Math.random()*5)];
      f.style.opacity='1'; f.style.color='#fff';
      setTimeout(()=>f.style.opacity='0',400);
    }
  },600);

  box.onclick=()=>{
    let f=box.querySelector('.face');
    if(f.style.opacity==='1'){ // kena!
      alive=false;
      box.style.transition='0.4s'; box.style.transform='scale(0) rotate(10deg)'; box.style.filter='blur(10px)';
      left--;
      setTimeout(()=>{ box.remove(); if(left<=0){ win.style.display='block'; grid.style.display='none';
        setTimeout(()=>location.href='#HARDEST',2000);
      }},400);
    }
  };
  grid.appendChild(box);
}
</script>
