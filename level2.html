<!-- LEVEL 02 FINAL - DESIGN ASLI + SYSTEM FIX WAJIB 5 -->
<div id="level02" style="max-width:600px;margin:auto">
<div class="card" style="background:#050505;border:1px solid #222;padding:15px">
<b style="letter-spacing:3px">LEVEL 02 // THREE RITUALS</b>
<div id="stageText" style="font-size:11px;opacity:0.6;margin:8px 0;letter-spacing:1px">STAGE 1/3: TURN THEM OFF</div>
<div id="grid02" style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px"></div>
<div id="win02" style="display:none;text-align:center;padding:80px 0">
<div style="font-size:22px;letter-spacing:5px;color:#fff">You have completed the beginning</div>
<div style="font-size:10px;opacity:0.4;margin-top:10px;letter-spacing:2px">The hardest begins now...</div>
</div>
</div>
</div>

<script>
let audioCtx;
function startCreepyAudio(){
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    let osc=audioCtx.createOscillator(); let gain=audioCtx.createGain(); let filter=audioCtx.createBiquadFilter();
    osc.type='sawtooth'; osc.frequency.value=42; filter.type='lowpass'; filter.frequency.value=350; gain.gain.value=0.05;
    osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); osc.start();
    setInterval(()=>{ if(!audioCtx) return; let o=audioCtx.createOscillator(); let g=audioCtx.createGain(); o.frequency.value=1200+Math.random()*3000; g.gain.value=0.025; o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.12); },700);
  }catch(e){}
}
document.body.addEventListener('click',()=>{ if(!audioCtx) startCreepyAudio(); },{once:true});

const grid=document.getElementById('grid02');
const stageText=document.getElementById('stageText');
const win=document.getElementById('win02');

function loadStage(s){
  grid.innerHTML=''; grid.style.display='grid';
  if(s===1) spawnTVs();
  if(s===2) spawnDoors();
  if(s===3) spawnSmiles();
  if(s===4){ grid.style.display='none'; win.style.display='block'; stageText.innerText='RITUAL COMPLETE'; setTimeout(()=>{ window.location.href='#HARDEST'; },2500); }
}

function spawnTVs(){
  let cleared=0;
  stageText.innerText=`STAGE 1/3: THE FACES IN THE STATIC - ${cleared}/5`;
  for(let i=0;i<5;i++){
    let box=document.createElement('div');
    box.style.cssText='background:#000;height:130px;position:relative;overflow:hidden;border:1px solid #222;cursor:crosshair';
    box.innerHTML='<canvas style="width:100%;height:100%"></canvas><div class="face" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;opacity:0;transition:0.05s">ʘ_ʘ</div>';
    let canvas=box.querySelector('canvas'); let ctx=canvas.getContext('2d'); canvas.width=200; canvas.height=130; let alive=true;
    let noise=setInterval(()=>{ if(!alive) return; let img=ctx.createImageData(200,130); for(let j=0;j<img.data.length;j+=4){ let v=Math.random()*255; img.data[j]=v; img.data[j+1]=v; img.data[j+2]=v; img.data[j+3]=255; } ctx.putImageData(img,0,0); },40);
    let faces=['ʘ_ʘ','ಠ_ಠ','☻','◉_◉','⚆_⚆'];
    let show=setInterval(()=>{ if(!alive) return; if(Math.random()<0.22){ let f=box.querySelector('.face'); f.innerText=faces[Math.floor(Math.random()*faces.length)]; f.style.opacity='1'; setTimeout(()=>f.style.opacity='0',380); } },550);
    box.onclick=()=>{
      let f=box.querySelector('.face');
      if(f.style.opacity==='1' && alive){
        alive=false; clearInterval(noise); clearInterval(show);
        box.style.transform='scale(0) rotate(5deg)'; box.style.filter='blur(5px)';
        cleared++; stageText.innerText=`STAGE 1/3: THE FACES IN THE STATIC - ${cleared}/5`;
        setTimeout(()=>{ box.remove(); if(cleared>=5) loadStage(2); },350);
      }
    };
    grid.appendChild(box);
  }
}

function spawnDoors(){
  let cleared=0;
  stageText.innerText=`STAGE 2/3: HOLD THE DOOR - ${cleared}/5`;
  for(let i=0;i<5;i++){
    let box=document.createElement('div');
    box.style.cssText='background:#0a0a0a;height:130px;border:1px solid #331111;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;';
    box.innerHTML='<div style="font-size:42px;transition:0.1s" class="door">🚪</div><div style="position:absolute;bottom:0;left:0;height:4px;background:#ff0000;width:0%" class="bar"></div><div style="position:absolute;top:5px;right:8px;font-size:10px;opacity:0" class="eyeDoor">◉</div>';
    let hold=false,pct=0,shake=0,alive=true;
    let t=setInterval(()=>{
      if(!alive) return;
      if(hold){ pct+=3.5; shake=0; box.querySelector('.door').style.transform='scale(1.1)'; } else { pct=Math.max(0,pct-2); shake+=0.6; box.style.transform=`translateX(${Math.sin(shake)*4}px)`; if(pct>30) box.querySelector('.eyeDoor').style.opacity='1'; else box.querySelector('.eyeDoor').style.opacity='0'; }
      box.querySelector('.bar').style.width=pct+'%';
      if(pct>=100 && alive){ alive=false; clearInterval(t); box.style.transform='scale(0)'; cleared++; stageText.innerText=`STAGE 2/3: HOLD THE DOOR - ${cleared}/5`; setTimeout(()=>{ box.remove(); if(cleared>=5) loadStage(3); },300); }
    },40);
    box.onmousedown=box.ontouchstart=()=>hold=true;
    box.onmouseup=box.ontouchend=box.onmouseleave=()=>hold=false;
    grid.appendChild(box);
  }
}

function spawnSmiles(){
  let cleared=0;
  stageText.innerText=`STAGE 3/3: SMILE - ${cleared}/5`;
  for(let i=0;i<5;i++){
    let box=document.createElement('div');
    box.style.cssText='background:#000;height:130px;border:1px solid #222;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;overflow:hidden';
    box.innerHTML=`
      <div class="scaryFace" style="text-align:center;transition:0.15s">
        <div style="font-size:18px;letter-spacing:12px;transition:0.2s" class="eyes">◉  ◉</div>
        <div class="mouth" style="width:18px;height:6px;background:#fff;margin:10px auto 0;border-radius:0 0 20px 20px;transition:0.15s;display:flex;align-items:center;justify-content:center;overflow:hidden"></div>
        <div class="blood" style="display:none;color:#ff0000;font-size:10px;margin-top:6px;letter-spacing:3px">|||</div>
      </div>
      <div style="position:absolute;bottom:0;left:0;height:3px;background:#ff0000;width:0%" class="bar"></div>
    `;
    let mouth=box.querySelector('.mouth'); let eyes=box.querySelector('.eyes'); let blood=box.querySelector('.blood'); let face=box.querySelector('.scaryFace');
    let width=18,height=6,stageSmile=0,clicks=0,alive=true;
    let t=setInterval(()=>{
      if(!alive) return;
      width+=0.45; height+=0.18;
      if(width>35 && stageSmile==0){ stageSmile=1; mouth.style.background='#ffcccc'; }
      if(width>65 && stageSmile==1){ stageSmile=2; mouth.style.background='#ff8888'; blood.style.display='block'; eyes.innerText='◎  ◎'; eyes.style.color='#ff0000'; }
      if(width>100 && stageSmile==2){ stageSmile=3; mouth.style.width='115px'; mouth.style.height='55px'; mouth.style.background='#ff0000'; mouth.style.borderRadius='3px'; mouth.innerHTML='<div style="font-size:10px;color:#000;font-weight:bold">︾︾︾︾</div>'; face.style.transform='scale(1.25)'; box.style.borderColor='#ff0000'; box.style.boxShadow='0 0 25px rgba(255,0,0,0.6)'; blood.innerText='█ BLOOD █'; }
      mouth.style.width=width+'px'; mouth.style.height=height+'px';
      if(width>125){ document.body.style.background='#440000'; setTimeout(()=>document.body.style.background='#000',80); }
    },45);
    box.onclick=()=>{
      if(!alive) return;
      clicks++; width=Math.max(18,width-28); height=Math.max(6,height-9);
      box.querySelector('.bar').style.width=(clicks*10)+'%';
      face.style.transform='scale(0.85)'; setTimeout(()=>face.style.transform='scale(1)',80);
      if(clicks>=10){ alive=false; clearInterval(t); mouth.style.background='#000'; mouth.innerHTML=''; blood.innerText='X_X DEAD'; blood.style.color='#555'; box.style.transform='scale(0) rotate(720deg)'; box.style.filter='blur(8px)'; cleared++; stageText.innerText=`STAGE 3/3: SMILE - ${cleared}/5`; setTimeout(()=>{ box.remove(); if(cleared>=5) loadStage(4); },400); }
    };
    grid.appendChild(box);
  }
}

loadStage(1);
      </script>
