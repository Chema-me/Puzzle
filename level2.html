<!-- FINAL HARD + KRESEK BALIK - NO ZOOM -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  *{ touch-action:manipulation; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:#000; color:#fff; font-family:monospace; overflow-x:hidden; }
  #level02{ width:100vw; min-height:100vh; }
  .header{ padding:28px 20px 15px; border-bottom:1px solid #222; position:sticky; top:0; background:#000; z-index:10; }
  .lore{ font-size:11px; opacity:0.6; letter-spacing:2px; margin-top:10px; font-style:italic; }
  #grid02{ display:grid; grid-template-columns:1fr 1fr; gap:0; width:100%; }
  .box{ height:35vh; min-height:220px; position:relative; overflow:hidden; border:0.5px solid #111; cursor:pointer; background:#000; display:flex; align-items:center; justify-content:center; }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
</style>

<div id="level02">
  <div class="header">
    <b style="letter-spacing:7px; font-size:13px">LEVEL 02 // THREE RITUALS</b>
    <div id="stageText" class="lore">Click anywhere for audio - The eyes look at you - 0/5</div>
  </div>
  <div id="grid02"></div>
  <div id="win02" style="display:none;text-align:center;padding:180px 20px">
    <div style="font-size:30px;letter-spacing:8px">You have completed the beginning</div>
  </div>
</div>

<script>
const grid=document.getElementById('grid02');
const stageText=document.getElementById('stageText');
let audioCtx, audioStarted=false;

function startAudio(){
  if(audioStarted) return; audioStarted=true;
  try{
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    
    // DRONE SEREM
    let osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),filter=audioCtx.createBiquadFilter();
    osc.type='sawtooth'; osc.frequency.value=35; filter.type='lowpass'; filter.frequency.value=250; gain.gain.value=0.09;
    osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); osc.start();

    // KRESEK BALIK - LEBIH SEREM
    setInterval(()=>{
      if(!audioCtx) return;
      // kresek pendek
      let o=audioCtx.createOscillator(), g=audioCtx.createGain(), f=audioCtx.createBiquadFilter();
      o.type='square'; o.frequency.value=1200+Math.random()*4000; 
      f.type='bandpass'; f.frequency.value=1500+Math.random()*2000;
      g.gain.value=0.12; // lebih keras
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.25);
      o.connect(f); f.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime+0.25);
    },280); // lebih sering dari 450 -> 280

    // tambahan static noise tipis
    setInterval(()=>{
      let o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.frequency.value=50+Math.random()*100; g.gain.value=0.03;
      o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.08);
    },150);

  }catch(e){}
}
document.addEventListener('touchstart', (e)=>{ startAudio(); }, {passive:false});
document.addEventListener('click', startAudio, {once:true});

function loadStage(s){ grid.innerHTML=''; if(s===1) spawnTVs(); if(s===2) spawnDoors(); if(s===3) spawnSmiles(); if(s===4){ grid.style.display='none'; document.getElementById('win02').style.display='block'; } }

function spawnTVs(){
  let cleared=0; stageText.innerText=`The eyes look at you - ${cleared}/5 - BE FAST`;
  for(let i=0;i<5;i++){
    let box=document.createElement('div'); box.className='box';
    box.innerHTML=`<canvas style="width:100%;height:100%"></canvas><div class="face" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:60px;opacity:0;font-weight:bold">ʘ_ʘ</div>`;
    let canvas=box.querySelector('canvas'),ctx=canvas.getContext('2d'); canvas.width=500; canvas.height=350; let alive=true;
    let noise=setInterval(()=>{ if(!alive) return; let img=ctx.createImageData(500,350); for(let j=0;j<img.data.length;j+=4){ let v=Math.random()*255; img.data[j]=v; img.data[j+1]=v; img.data[j+2]=v; img.data[j+3]=255; } ctx.putImageData(img,0,0); },25);
    let faces=['ʘ_ʘ','ಠ_ಠ','◉_◉','⚆_⚆'];
    // CEPETIN - muncul cuma 350ms
    let show=setInterval(()=>{ if(!alive) return; if(Math.random()<0.22){ let f=box.querySelector('.face'); f.innerText=faces[Math.floor(Math.random()*faces.length)]; f.style.opacity='1'; setTimeout(()=>f.style.opacity='0',350); } },650);
    let handler=(e)=>{ e.preventDefault(); let f=box.querySelector('.face'); if(f.style.opacity==='1' && alive){ alive=false; clearInterval(noise); clearInterval(show); box.style.transform='scale(0.8)'; box.style.filter='blur(10px)'; cleared++; stageText.innerText=`The eyes look at you - ${cleared}/5`; setTimeout(()=>{ box.style.display='none'; if(cleared>=5) loadStage(2); },400); } };
    box.addEventListener('touchend', handler, {passive:false}); box.addEventListener('click', handler);
    grid.appendChild(box);
  }
}

function spawnDoors(){
  let cleared=0; stageText.innerText=`Hold it! Don't let go - ${cleared}/5 sealed`;
  for(let i=0;i<5;i++){
    let box=document.createElement('div'); box.className='box'; box.style.background='#080202';
    box.innerHTML=`<div style="text-align:center"><div class="door" style="font-size:70px">🚪</div><div style="font-size:10px;opacity:0.4" class="txt">HOLD!</div></div><div class="bar" style="position:absolute;bottom:0;left:0;height:7px;background:#f00;width:0%"></div>`;
    let hold=false,pct=0,alive=true;
    let t=setInterval(()=>{ if(!alive) return; if(hold) pct+=3.2; else pct=Math.max(0,pct-5.5); // CEPETIN TURUNNYA biar susah
      box.querySelector('.bar').style.width=pct+'%'; if(pct>=100 && alive){ alive=false; clearInterval(t); cleared++; box.style.display='none'; if(cleared>=5) loadStage(3); } },30);
    box.addEventListener('touchstart', (e)=>{ e.preventDefault(); hold=true; }, {passive:false}); box.addEventListener('touchend', (e)=>{ e.preventDefault(); hold=false; }, {passive:false});
    box.addEventListener('mousedown', ()=>hold=true); box.addEventListener('mouseup', ()=>hold=false); box.addEventListener('mouseleave', ()=>hold=false);
    grid.appendChild(box);
  }
}

function spawnSmiles(){
  let cleared=0; stageText.innerText=`CLICK FAST! It rips faster now - ${cleared}/5`;
  for(let i=0;i<5;i++){
    let box=document.createElement('div'); box.className='box';
    box.innerHTML=`<div class="scaryFace" style="text-align:center"><div class="eyes" style="font-size:24px;letter-spacing:18px">◉  ◉</div><div class="mouth" style="width:24px;height:10px;background:#fff;margin:14px auto 0;border-radius:0 0 40px 40px;transition:0.1s;display:flex;align-items:center;justify-content:center;overflow:hidden"><div class="teeth" style="display:none;font-size:8px;color:#000">IIII</div></div><div class="blood" style="display:none;color:#f00;font-size:10px;margin-top:8px">▼ BLOOD ▼</div></div><div class="bar" style="position:absolute;bottom:0;left:0;height:7px;background:#f00;width:0%"></div>`;
    let mouth=box.querySelector('.mouth'), eyes=box.querySelector('.eyes'), blood=box.querySelector('.blood'), face=box.querySelector('.scaryFace'), teeth=box.querySelector('.teeth');
    let width=24,height=10,stage=0,clicks=0,alive=true;
    let t=setInterval(()=>{
      if(!alive) return;
      width+=1.15; height+=0.48; // CEPETIN 2x LIPAT
      if(width>55 && stage==0){ stage=1; mouth.style.background='#ffaaaa'; teeth.style.display='block'; }
      if(width>85 && stage==1){ stage=2; mouth.style.background='#ff4444'; blood.style.display='block'; eyes.innerText='◎  ◎'; eyes.style.color='#f00'; box.style.animation='shake 0.12s infinite'; }
      if(width>115 && stage==2){ stage=3; mouth.style.width='150px'; mouth.style.height='80px'; mouth.style.background='#f00'; mouth.innerHTML='<div style="color:#fff;font-size:12px">▼▼▼<br>IIII<br>▲▲▲</div>'; face.style.transform='scale(1.5)'; box.style.boxShadow='0 0 40px #f00'; document.body.style.background='#300'; setTimeout(()=>document.body.style.background='#000',100); }
      if(stage<3){ mouth.style.width=width+'px'; mouth.style.height=height+'px'; }
    },30); // interval lebih cepet dari 38 -> 30

    let handler=(e)=>{ e.preventDefault(); if(!alive) return; clicks++; width=Math.max(24,width-30); height=Math.max(10,height-12); box.querySelector('.bar').style.width=(clicks*8.5)+'%'; if(clicks>=14){ alive=false; clearInterval(t); box.style.animation='none'; box.style.display='none'; cleared++; stageText.innerText=`Silenced ${cleared}/5`; if(cleared>=5) loadStage(4); } };
    box.addEventListener('touchend', handler, {passive:false}); box.addEventListener('click', handler);
    grid.appendChild(box);
  }
}

loadStage(1);
</script>
